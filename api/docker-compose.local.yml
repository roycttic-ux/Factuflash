version: '3.8'
services:
  # Base de Datos Local
  mysql:
    image: mysql:8.0
    container_name: factuflash_mysql_local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-factuflash}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data_local:/var/lib/mysql
    networks:
      - factuflash_net_local

  # API (Laravel) Local - Usando PHP built-in server para desarrollo
  api:
    image: php:8.2-cli
    container_name: factuflash_api_local
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: bash -c "php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - mysql
    networks:
      - factuflash_net_local

networks:
  factuflash_net_local:
    driver: bridge

volumes:
  db_data_local:
