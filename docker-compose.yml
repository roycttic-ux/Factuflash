version: '3.8'

services:
  # Base de Datos
  mysql:
    image: mysql:8.0
    container_name: factuflash_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - factuflash_net

  # API (Laravel)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: factuflash_api
    restart: always
    volumes:
      - ./api:/var/www/html
    depends_on:
      - mysql
    networks:
      - factuflash_net

  # Nginx (Todo en uno: Landing + App)
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: factuflash_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - factuflash_net

networks:
  factuflash_net:
    driver: bridge

volumes:
  db_data: