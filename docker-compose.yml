version: '3.8'

services:
  # ── Base de datos ──
  mysql:
    image: mysql:8.0
    container_name: factuflash_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - factuflash_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Laravel ──
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: factuflash_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
    volumes:
      - ./api:/var/www/html
    networks:
      - factuflash_net

  # ── Frontend Vue (compilado) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: factuflash_frontend
    restart: always
    volumes:
      - ./app:/var/www/app
    networks:
      - factuflash_net

  # ── Servidor web Nginx ──
  nginx:
    image: nginx:stable-alpine
    container_name: factuflash_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/landing:/var/www/landing
      - ./frontend/dist:/var/www/app
      - ./api:/var/www/html
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - factuflash_net

networks:
  factuflash_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local