server {
    # FactuFlash is the safe default for this shared origin. Named vhosts for
    # other client domains remain separate and continue matching their hosts.
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/nginx/conf.d/selfsigned.crt;
    ssl_certificate_key /etc/nginx/conf.d/selfsigned.key;
    server_name factuflash.com.ar www.factuflash.com.ar;
    charset utf-8;
    
    # ── CLOUDFLARE E REAL IP ──
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # ── LANDING (Raíz) & CATÁLOGOS SIN /C/ ──
    # Según tu Dockerfile.nginx, está en /var/www/html/landing
    location / {
        root /var/www/html/landing;
        index index.html;
        try_files $uri $uri/ @catalog;
    }

    # Redirección interna para catálogos sin /c/
    location @catalog {
        rewrite ^/(.+)$ /app/#/catalogo/$1 last;
    }

    # ── CATÁLOGO LIMPIO (Retrocompatibilidad con /c/) ──
    location ~ ^/c/(.+) {
        return 301 /app/#/catalogo/$1;
    }

    # ── APP (El Sistema) ──
    # Según tu Dockerfile.nginx, está en /var/www/html/app
    # IMPORTANTE: Usamos un bloque específico para evitar el 403
    location /app {
        alias /var/www/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # ── API (Laravel 11 via PHP-FPM) ──
    location ~ ^/api {
        fastcgi_pass   api:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;

        fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param  SCRIPT_NAME      /index.php;
        fastcgi_param  REQUEST_URI      $request_uri;
        
        # Soporte para HTTPS via Cloudflare
        fastcgi_param  HTTPS on;
        fastcgi_param  HTTP_X_FORWARDED_PROTO https;
    }

    # ── FOTOS (Storage) ──
    location ^~ /api/storage/ {
        alias /var/www/html/storage/app/public/;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        try_files $uri $uri/ =404;
    }
}
