server {
    listen 80;
    server_name _;

    # ── LANDING (raíz del sitio) ──
    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── APP (frontend compilado Vue) ──
    location /app {
        root /var/www/app;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # ── API LARAVEL ──
    location ~ ^/api/(.*)$ {
        root /var/www/html/public;
        index index.php;

        # Intentar servir el archivo estático, si no, pasar al index.php de Laravel
        try_files $uri /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass api:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /api/index.php;
            fastcgi_param REQUEST_URI /api/$1;
        }
    }
}