server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # ── LANDING (Raíz) ──
    location / {
        root /var/www/html/landing;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── APP (El Sistema) ──
    location /app {
        alias /var/www/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # ── API (Laravel 11 via PHP-FPM) ──
    # Toda request que empiece con /api va al contenedor php-fpm 'api'
    # Laravel 11 espera recibir la URL completa con /api (manejado por withRouting)
    location ~ ^/api {
        fastcgi_pass   api:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;

        # Entry point de Laravel: siempre index.php dentro del contenedor api
        fastcgi_param  SCRIPT_FILENAME  /var/www/html/public/index.php;
        fastcgi_param  SCRIPT_NAME      /index.php;

        # Pasamos la URL completa (/api/v1/...) para que el router de Laravel la resuelva
        fastcgi_param  REQUEST_URI      $request_uri;
    }
}